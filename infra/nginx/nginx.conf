# Round-robin across the app replicas.
# Docker's embedded DNS (127.0.0.11) returns every replica of "app". Resolving per request
# (variable in proxy_pass + short "valid") means a replica that restarts with a new IP is
# picked up again, instead of nginx caching the IPs it saw at startup.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;

  location / {
    set $app_upstream http://app:3000;
    proxy_pass $app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    # A replica that dies mid-request: retry idempotent requests on another one.
    proxy_next_upstream error timeout http_502 http_503;
  }
}
