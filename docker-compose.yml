name: wagering

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      # 5433 on the host: a native PostgreSQL may already own 5432 on Windows
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    # Pinned: newer LocalStack releases may require an auth token (see CLAUDE.md learnings).
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '4566:4566'
    volumes:
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'awslocal sqs get-queue-url --queue-name wagering-events.fifo >/dev/null 2>&1',
        ]
      interval: 3s
      timeout: 5s
      retries: 40

  # One-shot: applies pending migrations before any app replica starts.
  migrate:
    build: .
    image: wagering-app
    profiles: ['app']
    command: ['bun', 'src/infrastructure/persistence/migrate.ts', 'up']
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres: { condition: service_healthy }

  app:
    image: wagering-app
    profiles: ['app']
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_ROLES: api,consumer,outbox,pending
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 256m
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }

  lb:
    image: nginx:1.27-alpine
    profiles: ['app']
    ports:
      - '3000:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: { condition: service_healthy }

volumes:
  pgdata:
