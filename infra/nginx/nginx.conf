# Round-robin across ALL app replicas.
# Docker's embedded DNS (127.0.0.11) returns every replica of "app". With `resolve`
# (open-source nginx >= 1.27.3) the upstream group is kept in sync with DNS: a replica that
# restarts with a new IP is picked up, and requests are balanced over the whole set.
# (The previous `proxy_pass $variable` approach re-resolved per request and reset the
# round-robin each time, which skewed traffic: one replica got no requests at all.)
resolver 127.0.0.11 valid=5s ipv6=off;

upstream app_replicas {
  zone app_replicas 64k;
  # max_fails=0: never mark a peer as dead (with the DNS set changing during a restart that
  # produced "no live upstreams" -> 502); a failed attempt simply moves to the next peer.
  server app:3000 resolve max_fails=0;
}

server {
  listen 80;

  location / {
    proxy_pass http://app_replicas;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    # A replica that is gone or dying: fail fast and try another one (idempotent requests only;
    # nginx never retries a POST that was already sent, and the API is idempotent anyway).
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 3;
  }
}
